name: Backfill installable release ZIPs

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/backfill-release-zips.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload correct plugin-root ZIP for existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in 1.0.1 1.0.2 1.0.3 1.0.4; do
            git rev-parse --verify "refs/tags/$tag"
            git archive --format=zip --prefix=lessonvideo/ -o mod_lessonvideo.zip "$tag"
            unzip -Z1 mod_lessonvideo.zip | awk '
              $0 !~ /^lessonvideo\// { print "Invalid ZIP root: " $0; bad = 1 }
              END { exit bad }
            '
            gh release upload "$tag" mod_lessonvideo.zip --clobber
          done
